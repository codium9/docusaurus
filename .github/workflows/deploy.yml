name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Permet d'activer le workflow manuellement depuis l'interface GitHub Actions    
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Extraire votre dépôt à l'aide de git
        uses: actions/checkout@v5
      - name: Supprimer les anciens artefacts
        uses: geekyeggo/delete-artifact@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler le site
        run: npm run build

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v4

      - name: Uploader l'artifact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
